<svg width="605" height="432" viewBox="0 0 605 432"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f3_1_arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="f3_1_arrowA" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="605" height="432" fill="#ffffff"/>
  <text x="20" y="22" text-anchor="start" dominant-baseline="central" font-size="12" fill="#555">封筒にたとえると</text>
  <rect x="20" y="36" width="565" height="52" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="32" y="52" text-anchor="start" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-weight="bold">① メソッドとURL（宛先）</text>
  <text x="32" y="72" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a">POST  https://api.anthropic.com/v1/messages</text>
  <text x="575" y="72" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">誤り → 404</text>
  <rect x="20" y="98" width="565" height="106" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="32" y="114" text-anchor="start" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-weight="bold">② ヘッダー（封筒の表書き）</text>
  <text x="40" y="136" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a">x-api-key</text>
  <text x="200" y="136" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">認証：誰からのリクエストか</text>
  <text x="575" y="136" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">誤り → 401</text>
  <text x="40" y="158" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a">anthropic-version</text>
  <text x="200" y="158" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">版：2026-10-21 の仕様で解釈</text>
  <text x="40" y="180" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a">content-type</text>
  <text x="200" y="180" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">形式：application/json</text>
  <rect x="20" y="214" width="565" height="160" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="32" y="230" text-anchor="start" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-weight="bold">③ ボディ（手紙そのもの）＝ JSON</text>
  <text x="575" y="230" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">必須項目の欠落 → 400</text>
  <rect x="32" y="244" width="255" height="120" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.2"/>
  <text x="44" y="258" text-anchor="start" dominant-baseline="central" font-size="11" fill="#2b6cb0" font-weight="bold">必須の3項目</text>
  <text x="44" y="282" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a" font-weight="bold">model</text>
  <text x="150" y="282" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">使うモデルのID</text>
  <text x="44" y="308" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a" font-weight="bold">max_tokens</text>
  <text x="150" y="308" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">出力トークン数の上限</text>
  <text x="44" y="334" text-anchor="start" dominant-baseline="central" font-size="12" font-family="Consolas,monospace" fill="#1a1a1a" font-weight="bold">messages</text>
  <text x="150" y="334" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">会話の履歴（配列）</text>
  <rect x="300" y="244" width="273" height="120" rx="6" fill="#ffffff" stroke="#333" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="312" y="258" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-weight="bold">任意の項目（必要なときに足す）</text>
  <text x="312" y="278" text-anchor="start" dominant-baseline="central" font-size="11" font-family="Consolas,monospace" fill="#1a1a1a">system</text>
  <text x="563" y="278" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">役割・前提</text>
  <text x="312" y="296" text-anchor="start" dominant-baseline="central" font-size="11" font-family="Consolas,monospace" fill="#1a1a1a">stop_sequences</text>
  <text x="563" y="296" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">止める文字列</text>
  <text x="312" y="314" text-anchor="start" dominant-baseline="central" font-size="11" font-family="Consolas,monospace" fill="#1a1a1a">output_config</text>
  <text x="563" y="314" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">effort・format</text>
  <text x="312" y="332" text-anchor="start" dominant-baseline="central" font-size="11" font-family="Consolas,monospace" fill="#1a1a1a">tools / tool_choice</text>
  <text x="563" y="332" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">第5章</text>
  <text x="312" y="350" text-anchor="start" dominant-baseline="central" font-size="11" font-family="Consolas,monospace" fill="#1a1a1a">stream</text>
  <text x="563" y="350" text-anchor="end" dominant-baseline="central" font-size="11" fill="#555">第4章</text>
  <text x="302" y="392" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#555">※ temperature・top_p・top_k は 2026-10-21 版では送ると400エラー</text>
  <text x="302" y="418" text-anchor="middle" font-size="11" fill="#666">図3.1 Messages APIリクエストの構造</text>
</svg>
