<svg width="605" height="440" viewBox="0 0 605 440"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f4_1_arr41" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="f4_1_arr41a" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="605" height="440" fill="#ffffff"/>

  <!-- 呼び出し側 -->
  <rect x="20" y="15" width="400" height="30" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="220.0" y="30.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a">呼び出し側（第5章以降のスクリプト・agent.py）</text>
  <path d="M220 45 L220 63" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f4_1_arr41)"/>

  <!-- 公開関数の層 -->
  <rect x="20" y="65" width="400" height="85" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="30" y="79" text-anchor="start" dominant-baseline="central" font-size="12" fill="#2b6cb0" font-weight="bold">公開関数の層</text>
  <rect x="28" y="92" width="124" height="50" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="90.0" y="109.3" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">call_messages()</text>
  <text x="90.0" y="124.7" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">非ストリーミング</text>
  <rect x="158" y="92" width="124" height="50" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="220.0" y="109.3" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">stream_messages()</text>
  <text x="220.0" y="124.7" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">ストリーミング</text>
  <rect x="288" y="92" width="124" height="50" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="350.0" y="109.3" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">extract_text()</text>
  <text x="350.0" y="124.7" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">get_tool_uses()</text>
  <path d="M220 150 L220 168" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f4_1_arr41)"/>

  <!-- 送信と再試行の層 -->
  <rect x="20" y="170" width="400" height="100" rx="6" fill="none" stroke="#999" stroke-width="1"/>
  <text x="30" y="184" text-anchor="start" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-weight="bold">送信と再試行の層</text>
  <rect x="28" y="197" width="150" height="64" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="103.0" y="221.3" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">build_headers()</text>
  <text x="103.0" y="236.7" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">_build_body()</text>
  <rect x="186" y="197" width="226" height="64" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="299.0" y="221.3" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-family="Consolas,monospace">_request_with_retry()</text>
  <text x="299.0" y="237.4" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">_is_retryable() / _retry_delay()</text>
  <path d="M220 270 L220 288" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f4_1_arr41)"/>

  <!-- 共有クライアント -->
  <rect x="20" y="290" width="400" height="48" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="220.0" y="306.3" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-family="Consolas,monospace">_client = httpx.Client(...)</text>
  <text x="220.0" y="322.4" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">接続プールを持つクライアントを1つだけ作って使い回す</text>
  <path d="M220 340 L220 368" fill="none" stroke="#333" stroke-width="1.3" marker-start="url(#f4_1_arr41)" marker-end="url(#f4_1_arr41)"/>
  <text x="232" y="354" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">HTTPS（POST /v1/messages）</text>
  <rect x="70" y="370" width="300" height="32" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="220.0" y="386.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a">Claude API（api.anthropic.com）</text>

  <!-- 横の部品 -->
  <rect x="445" y="65" width="145" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="517.5" y="88.9" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a">例外クラス</text>
  <text x="517.5" y="105.7" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#1a1a1a" font-family="Consolas,monospace">APIError</text>
  <text x="517.5" y="121.8" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">＋子クラス9つ</text>
  <rect x="445" y="160" width="145" height="58" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="517.5" y="173.6" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">SSEの解析</text>
  <text x="517.5" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">_iter_sse()</text>
  <text x="517.5" y="204.4" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">_StreamAccumulator</text>
  <rect x="445" y="228" width="145" height="58" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="517.5" y="241.6" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a">コスト集計・ログ</text>
  <text x="517.5" y="257.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">CostTracker</text>
  <text x="517.5" y="272.4" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">_log_call()</text>
  <path d="M420 189 L443 189" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f4_1_arr41)"/>
  <path d="M420 257 L443 257" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f4_1_arr41)"/>
  <path d="M517 65 L517 30 L422 30" fill="none" stroke="#333" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#f4_1_arr41)"/>
  <text x="525" y="50" text-anchor="start" dominant-baseline="central" font-size="11" fill="#1a1a1a">失敗時に送出</text>
</svg>
