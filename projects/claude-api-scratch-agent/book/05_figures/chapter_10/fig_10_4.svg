<svg width="605" height="420" viewBox="0 0 605 420"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f10_4_arr10_4" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="f10_4_arr10_4b" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 上段: 執筆 → 採点 → 合否判定 → 終了 -->
  <rect x="20" y="40" width="120" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="80" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">執筆</text>
  <text x="80" y="80" text-anchor="middle" font-size="11" fill="#1a1a1a">ライター</text>
  <text x="80" y="97" text-anchor="middle" font-size="9" fill="#1a1a1a" font-family="Consolas,monospace">draft_vN.md</text>

  <rect x="172" y="40" width="120" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="232" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">採点</text>
  <text x="232" y="80" text-anchor="middle" font-size="11" fill="#1a1a1a">レビュアー</text>
  <text x="232" y="97" text-anchor="middle" font-size="10" fill="#1a1a1a">5観点×1〜5点</text>

  <rect x="325" y="40" width="130" height="66" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="390" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">合否判定</text>
  <text x="390" y="80" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">is_passed()</text>
  <text x="390" y="97" text-anchor="middle" font-size="10" fill="#1a1a1a">コードで全観点4点以上</text>

  <rect x="490" y="40" width="100" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="540" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">終了</text>
  <text x="540" y="80" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">report.md</text>
  <text x="540" y="97" text-anchor="middle" font-size="10" fill="#1a1a1a">を出力</text>

  <path d="M140 73 L170 73" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>
  <path d="M292 73 L323 73" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>
  <path d="M455 73 L488 73" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>
  <text x="472" y="66" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">合格</text>

  <!-- 不合格 → 次の一手 -->
  <path d="M390 106 L390 178" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>
  <text x="397" y="146" font-size="10" fill="#1a1a1a">不合格</text>

  <rect x="325" y="180" width="130" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="390" y="204" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">次の一手を選ぶ</text>
  <text x="390" y="223" text-anchor="middle" font-size="11" fill="#1a1a1a">オーケストレーター</text>
  <text x="390" y="239" text-anchor="middle" font-size="10" fill="#1a1a1a">指摘を読んで判断</text>

  <!-- 上限・予算切れで終了 -->
  <path d="M455 213 L540 213 L540 108" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>
  <text x="532" y="150" text-anchor="end" font-size="10" fill="#1a1a1a">修正回数</text>
  <text x="532" y="164" text-anchor="end" font-size="10" fill="#1a1a1a">の上限・</text>
  <text x="532" y="178" text-anchor="end" font-size="10" fill="#1a1a1a">予算切れ</text>

  <!-- 書き直し -->
  <rect x="172" y="180" width="120" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="232" y="202" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">書き直し</text>
  <text x="232" y="220" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">delegate_write</text>
  <text x="232" y="238" text-anchor="middle" font-size="10" fill="#1a1a1a">表現・構成の問題</text>
  <path d="M325 213 L294 213" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>

  <!-- 追加調査 -->
  <rect x="172" y="280" width="120" height="66" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="232" y="302" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">追加調査</text>
  <text x="232" y="320" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">delegate_research</text>
  <text x="232" y="338" text-anchor="middle" font-size="10" fill="#1a1a1a">根拠・情報の不足</text>
  <path d="M370 246 L370 313 L294 313" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f10_4_arr10_4)"/>

  <!-- 執筆に戻る -->
  <path d="M172 213 L110 213 L110 108" fill="none" stroke="#2b6cb0" stroke-width="1.3" marker-end="url(#f10_4_arr10_4b)"/>
  <path d="M172 313 L60 313 L60 108" fill="none" stroke="#2b6cb0" stroke-width="1.3" marker-end="url(#f10_4_arr10_4b)"/>
  <text x="66" y="150" font-size="10" fill="#2b6cb0" font-weight="bold">再び</text>
  <text x="66" y="164" font-size="10" fill="#2b6cb0" font-weight="bold">執筆</text>
  <text x="66" y="178" font-size="10" fill="#2b6cb0" font-weight="bold">→採点</text>

  <text x="302" y="378" text-anchor="middle" font-size="11" fill="#1a1a1a">止まる条件は3つ：合格・修正回数の上限・予算（どれか1つで必ず止まる）</text>
</svg>
