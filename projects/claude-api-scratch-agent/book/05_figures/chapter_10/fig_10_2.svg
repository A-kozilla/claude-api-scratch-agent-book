<svg width="605" height="350" viewBox="0 0 605 350"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f10_2_arr10_2" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 指揮役 -->
  <rect x="177" y="24" width="250" height="84" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="302" y="48" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">オーケストレーター</text>
  <text x="302" y="70" text-anchor="middle" font-size="12" fill="#2b6cb0" font-family="Consolas,monospace" font-weight="bold">claude-opus-5-5</text>
  <text x="302" y="93" text-anchor="middle" font-size="11" fill="#1a1a1a">計画・委譲・完了判断</text>

  <!-- 委譲の線 -->
  <path d="M302 108 L302 140" stroke="#333" stroke-width="1.3" fill="none"/>
  <path d="M102 140 L502 140" stroke="#333" stroke-width="1.3" fill="none"/>
  <path d="M102 140 L102 184" stroke="#333" stroke-width="1.3" marker-end="url(#f10_2_arr10_2)"/>
  <path d="M302 140 L302 196" stroke="#333" stroke-width="1.3" marker-end="url(#f10_2_arr10_2)"/>
  <path d="M502 140 L502 196" stroke="#333" stroke-width="1.3" marker-end="url(#f10_2_arr10_2)"/>
  <text x="108" y="166" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">delegate_research</text>
  <text x="308" y="172" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">delegate_write</text>
  <text x="496" y="172" text-anchor="end" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">delegate_review</text>

  <!-- リサーチャー（並列で複数動く） -->
  <rect x="29" y="186" width="170" height="80" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <rect x="23" y="192" width="170" height="80" rx="6" fill="#f5f5f5" stroke="#999" stroke-width="1"/>
  <rect x="17" y="198" width="170" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="102" y="220" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">リサーチャー</text>
  <text x="102" y="241" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">claude-haiku-5-5</text>
  <text x="102" y="262" text-anchor="middle" font-size="11" fill="#1a1a1a">問いごとに並列で調査</text>
  <text x="102" y="294" text-anchor="middle" font-size="10" fill="#1a1a1a">× 問いの数だけ呼び出す</text>

  <!-- ライター -->
  <rect x="217" y="198" width="170" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="302" y="220" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">ライター</text>
  <text x="302" y="241" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">claude-sonnet-5-5</text>
  <text x="302" y="262" text-anchor="middle" font-size="11" fill="#1a1a1a">メモからレポートを執筆</text>

  <!-- レビュアー -->
  <rect x="417" y="198" width="170" height="80" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="502" y="220" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">レビュアー</text>
  <text x="502" y="241" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">claude-sonnet-5-5</text>
  <text x="502" y="262" text-anchor="middle" font-size="11" fill="#1a1a1a">ルーブリックで採点</text>

  <text x="302" y="312" text-anchor="middle" font-size="11" fill="#1a1a1a">件数の多い仕事は軽いモデル、判断の要は高性能なモデルに割り当てる</text>
</svg>
