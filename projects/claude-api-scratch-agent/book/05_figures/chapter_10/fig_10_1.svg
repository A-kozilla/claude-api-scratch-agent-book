<svg width="605" height="370" viewBox="0 0 605 370"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f10_1_arr10_1" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
    <marker id="f10_1_arr10_1b" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 上段: ① 計画 → ② 調査 → ③ 執筆 -->
  <rect x="30" y="40" width="150" height="56" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="105" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">① 計画</text>
  <text x="105" y="83" text-anchor="middle" font-size="11" fill="#1a1a1a">オーケストレーター</text>

  <rect x="228" y="40" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="303" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">② 調査</text>
  <text x="303" y="83" text-anchor="middle" font-size="11" fill="#1a1a1a">リサーチャー</text>

  <rect x="426" y="40" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="501" y="62" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">③ 執筆</text>
  <text x="501" y="83" text-anchor="middle" font-size="11" fill="#1a1a1a">ライター</text>

  <!-- 下段: ⑥ 完了 ← ⑤ 修正 ← ④ レビュー -->
  <rect x="426" y="210" width="150" height="56" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="501" y="232" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">④ レビュー</text>
  <text x="501" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">レビュアー</text>

  <rect x="228" y="210" width="150" height="56" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="303" y="232" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">⑤ 修正</text>
  <text x="303" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">オーケストレーター</text>

  <rect x="30" y="210" width="150" height="56" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.3"/>
  <text x="105" y="232" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">⑥ 完了</text>
  <text x="105" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">オーケストレーター</text>

  <!-- 基本の流れ -->
  <path d="M180 68 L226 68" stroke="#333" stroke-width="1.3" marker-end="url(#f10_1_arr10_1)"/>
  <path d="M378 68 L424 68" stroke="#333" stroke-width="1.3" marker-end="url(#f10_1_arr10_1)"/>
  <path d="M501 96 L501 208" stroke="#333" stroke-width="1.3" marker-end="url(#f10_1_arr10_1)"/>
  <path d="M426 238 L380 238" stroke="#333" stroke-width="1.3" marker-end="url(#f10_1_arr10_1)"/>
  <text x="403" y="230" text-anchor="middle" font-size="10" fill="#1a1a1a">不合格</text>

  <!-- 修正のループ（追加調査 / 書き直し → 再レビュー） -->
  <path d="M303 210 L303 98" stroke="#2b6cb0" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#f10_1_arr10_1b)"/>
  <text x="295" y="150" text-anchor="end" font-size="10" fill="#2b6cb0" font-weight="bold">根拠不足なら</text>
  <text x="295" y="164" text-anchor="end" font-size="10" fill="#2b6cb0" font-weight="bold">追加調査</text>
  <path d="M362 210 L438 98" stroke="#2b6cb0" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#f10_1_arr10_1b)"/>
  <text x="410" y="164" font-size="10" fill="#2b6cb0" font-weight="bold">表現の問題なら</text>
  <text x="410" y="178" font-size="10" fill="#2b6cb0" font-weight="bold">書き直し</text>

  <!-- 合格・上限で完了 -->
  <path d="M501 266 L501 296 L105 296 L105 268" fill="none" stroke="#333" stroke-width="1.3" marker-end="url(#f10_1_arr10_1)"/>
  <text x="303" y="314" text-anchor="middle" font-size="11" fill="#1a1a1a">合格、または修正回数・予算の上限に達したら提出</text>

  <text x="580" y="28" text-anchor="end" font-size="10" fill="#2b6cb0">青枠＝オーケストレーターが担う段階</text>
</svg>
