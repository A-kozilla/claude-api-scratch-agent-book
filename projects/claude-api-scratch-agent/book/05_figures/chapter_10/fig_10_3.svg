<svg width="605" height="400" viewBox="0 0 605 400"
     xmlns="http://www.w3.org/2000/svg"
     font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f10_3_arr10_3" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- オーケストレーター -->
  <rect x="202" y="16" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="302" y="37" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">オーケストレーター</text>
  <text x="302" y="56" text-anchor="middle" font-size="10" fill="#1a1a1a">本文は読まず、報告だけで判断</text>

  <path d="M272 66 L272 106" stroke="#333" stroke-width="1.3" marker-end="url(#f10_3_arr10_3)"/>
  <text x="264" y="84" text-anchor="end" font-size="10" fill="#1a1a1a">書く：plan.json・</text>
  <text x="264" y="98" text-anchor="end" font-size="10" fill="#1a1a1a">report.md・cost.json</text>
  <path d="M332 106 L332 68" stroke="#333" stroke-width="1.3" marker-end="url(#f10_3_arr10_3)"/>
  <text x="340" y="84" font-size="10" fill="#1a1a1a">短い報告だけ受け取る</text>
  <text x="340" y="98" font-size="10" fill="#1a1a1a">（保存先と文字数）</text>

  <!-- 共有ストア -->
  <rect x="200" y="108" width="205" height="200" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="302" y="128" text-anchor="middle" font-size="12" fill="#2b6cb0" font-weight="bold">共有ストア</text>
  <text x="302" y="146" text-anchor="middle" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">workspace/runs/&lt;実行ID&gt;/</text>
  <line x1="212" y1="156" x2="393" y2="156" stroke="#2b6cb0" stroke-width="0.8"/>
  <text x="216" y="176" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">plan.json</text>
  <text x="216" y="198" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">notes/q1.md …</text>
  <text x="216" y="220" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">drafts/draft_v1.md …</text>
  <text x="216" y="242" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">reviews/review_v1.json …</text>
  <text x="216" y="264" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">report.md</text>
  <text x="216" y="286" font-size="11" fill="#1a1a1a" font-family="Consolas,monospace">cost.json</text>

  <!-- リサーチャー -->
  <rect x="20" y="120" width="150" height="60" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="95" y="142" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">リサーチャー</text>
  <text x="95" y="164" text-anchor="middle" font-size="10" fill="#1a1a1a">書く：notes/</text>
  <path d="M170 150 L198 150" stroke="#333" stroke-width="1.3" marker-end="url(#f10_3_arr10_3)"/>

  <!-- 人間 -->
  <rect x="20" y="240" width="150" height="60" rx="6" fill="#fff" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="95" y="262" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">人間</text>
  <text x="95" y="284" text-anchor="middle" font-size="10" fill="#1a1a1a">途中経過を後から確認</text>
  <path d="M200 270 L172 270" stroke="#999" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f10_3_arr10_3)"/>

  <!-- ライター -->
  <rect x="435" y="114" width="150" height="72" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="510" y="134" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">ライター</text>
  <text x="510" y="154" text-anchor="middle" font-size="10" fill="#1a1a1a">読む：notes/・前の版</text>
  <text x="510" y="174" text-anchor="middle" font-size="10" fill="#1a1a1a">書く：drafts/</text>
  <path d="M407 150 L433 150" stroke="#333" stroke-width="1.3" marker-start="url(#f10_3_arr10_3)" marker-end="url(#f10_3_arr10_3)"/>

  <!-- レビュアー -->
  <rect x="435" y="234" width="150" height="72" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="510" y="254" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">レビュアー</text>
  <text x="510" y="274" text-anchor="middle" font-size="10" fill="#1a1a1a">読む：drafts/・notes/</text>
  <text x="510" y="294" text-anchor="middle" font-size="10" fill="#1a1a1a">書く：reviews/</text>
  <path d="M407 270 L433 270" stroke="#333" stroke-width="1.3" marker-start="url(#f10_3_arr10_3)" marker-end="url(#f10_3_arr10_3)"/>

  <text x="302" y="340" text-anchor="middle" font-size="11" fill="#1a1a1a">エージェント同士は会話履歴を共有せず、ファイルで受け渡す</text>
</svg>
