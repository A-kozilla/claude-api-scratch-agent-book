  <!-- 凡例 -->
  <rect x="20" y="282" width="12" height="12" rx="2" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>
  <text x="38" y="292" font-size="10" fill="#1a1a1a">トレースID：依頼全体を表す（自分で発行し、全ログに付ける）</text>
