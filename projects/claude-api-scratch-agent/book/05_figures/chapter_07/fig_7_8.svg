<svg width="605" height="330" viewBox="0 0 605 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f7_8_ar78" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 列見出し -->
  <text x="160" y="40" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas,monospace">low</text>
  <rect x="207" y="22" width="86" height="46" rx="6" fill="none" stroke="#2b6cb0" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="250" y="40" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas,monospace">medium</text>
  <text x="250" y="60" text-anchor="middle" font-size="10" fill="#2b6cb0" font-weight="bold">既定</text>
  <text x="340" y="40" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas,monospace">high</text>
  <text x="430" y="40" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas,monospace">xhigh</text>
  <text x="520" y="40" text-anchor="middle" font-size="13" fill="#1a1a1a" font-family="Consolas,monospace">max</text>

  <!-- 行: 思考量 -->
  <text x="20" y="99" font-size="12" fill="#1a1a1a">思考量</text>
  <rect x="123" y="87" width="15" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="213" y="87" width="30" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="303" y="87" width="45" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="393" y="87" width="60" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>
  <rect x="483" y="87" width="75" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1"/>

  <!-- 行: 待ち時間 -->
  <text x="20" y="144" font-size="12" fill="#1a1a1a">待ち時間</text>
  <rect x="123" y="132" width="15" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="213" y="132" width="30" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="303" y="132" width="45" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="393" y="132" width="60" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="483" y="132" width="75" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>

  <!-- 行: コスト -->
  <text x="20" y="189" font-size="12" fill="#1a1a1a">コスト</text>
  <rect x="123" y="177" width="15" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="213" y="177" width="30" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="303" y="177" width="45" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="393" y="177" width="60" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <rect x="483" y="177" width="75" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>

  <!-- 区切り -->
  <line x1="15" y1="212" x2="590" y2="212" stroke="#999" stroke-width="1"/>

  <!-- 行: タスクの目安 -->
  <text x="20" y="240" font-size="12" fill="#1a1a1a">タスクの目安</text>
  <text x="160" y="240" text-anchor="middle" font-size="10" fill="#1a1a1a">分類・定型抽出</text>
  <text x="250" y="240" text-anchor="middle" font-size="10" fill="#1a1a1a">一般的な対話</text>
  <text x="340" y="240" text-anchor="middle" font-size="10" fill="#1a1a1a">調査・デバッグ</text>
  <text x="430" y="240" text-anchor="middle" font-size="10" fill="#1a1a1a">長時間の自律作業</text>
  <text x="520" y="240" text-anchor="middle" font-size="10" fill="#1a1a1a">最難関の問題</text>

  <!-- 増加方向 -->
  <path d="M120 268 L575 268" stroke="#333" stroke-width="1.3" marker-end="url(#f7_8_ar78)"/>
  <text x="347" y="261" text-anchor="middle" font-size="11" fill="#1a1a1a">考える深さ・待ち時間・コストが増える</text>

  <text x="302" y="296" text-anchor="middle" font-size="11" fill="#666">まず medium で動かし、品質不足なら上げ、遅さ・コストが気になれば下げる</text>
  <text x="302" y="315" text-anchor="middle" font-size="10" fill="#666">※ 傾向を表す模式図。effort は目安で、考えるかどうかは問いごとにモデルが判断する</text>
