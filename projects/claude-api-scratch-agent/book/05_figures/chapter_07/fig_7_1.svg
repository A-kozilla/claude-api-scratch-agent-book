<svg width="605" height="330" viewBox="0 0 605 330" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f7_1_ar71" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- コンテキストウィンドウの上限 -->
  <line x1="40" y1="50" x2="420" y2="50" stroke="#333" stroke-width="1.3" stroke-dasharray="6,4"/>
  <text x="40" y="40" font-size="12" fill="#1a1a1a" font-weight="bold">コンテキストウィンドウの上限（1M トークン）</text>
  <!-- 基準線 -->
  <line x1="40" y1="290" x2="420" y2="290" stroke="#333" stroke-width="1.2"/>

  <!-- 1ターン目 -->
  <rect x="60" y="270" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="105" y="284" text-anchor="middle" font-size="11" fill="#1a1a1a">tools</text>
  <rect x="60" y="250" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="105" y="264" text-anchor="middle" font-size="11" fill="#1a1a1a">system</text>
  <rect x="60" y="220" width="90" height="30" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="105" y="239" text-anchor="middle" font-size="11" fill="#1a1a1a">messages</text>

  <!-- 5ターン目 -->
  <rect x="185" y="270" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="230" y="284" text-anchor="middle" font-size="11" fill="#1a1a1a">tools</text>
  <rect x="185" y="250" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="230" y="264" text-anchor="middle" font-size="11" fill="#1a1a1a">system</text>
  <rect x="185" y="140" width="90" height="110" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="230" y="199" text-anchor="middle" font-size="11" fill="#1a1a1a">messages</text>

  <!-- 10ターン目 -->
  <rect x="310" y="270" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="355" y="284" text-anchor="middle" font-size="11" fill="#1a1a1a">tools</text>
  <rect x="310" y="250" width="90" height="20" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="355" y="264" text-anchor="middle" font-size="11" fill="#1a1a1a">system</text>
  <rect x="310" y="60" width="90" height="190" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <line x1="310" y1="110" x2="400" y2="110" stroke="#2b6cb0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="310" y1="180" x2="400" y2="180" stroke="#2b6cb0" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="355" y="150" text-anchor="middle" font-size="11" fill="#1a1a1a">messages</text>
  <text x="355" y="166" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">tool_result</text>

  <!-- ターンの増加 -->
  <path d="M150 215 Q 180 90 300 68" fill="none" stroke="#666" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f7_1_ar71)"/>

  <text x="105" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">1ターン目</text>
  <text x="230" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">5ターン目</text>
  <text x="355" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">10ターン目</text>

  <!-- 凡例 -->
  <text x="430" y="70" font-size="11" fill="#2b6cb0" font-weight="bold">← 上限に近づく</text>
  <text x="440" y="130" font-size="12" fill="#1a1a1a" font-weight="bold">1回のリクエストの入力</text>
  <rect x="440" y="148" width="16" height="16" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="462" y="160" font-size="11" fill="#1a1a1a">messages</text>
  <text x="462" y="176" font-size="11" fill="#1a1a1a">ターンごとに増え続ける</text>
  <rect x="440" y="196" width="16" height="16" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="462" y="208" font-size="11" fill="#1a1a1a">tools・system</text>
  <text x="462" y="224" font-size="11" fill="#1a1a1a">毎回ほぼ同じ量</text>
  <text x="440" y="256" font-size="10" fill="#666">過去の履歴を毎回</text>
  <text x="440" y="270" font-size="10" fill="#666">すべて積み直して送る</text>
</svg>
