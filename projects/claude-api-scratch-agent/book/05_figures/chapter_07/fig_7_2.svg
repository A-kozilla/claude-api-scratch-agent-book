<svg width="605" height="295" viewBox="0 0 605 295" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP',sans-serif">
  <!-- 全体: 上限 1M -->
  <text x="50" y="30" font-size="12" fill="#1a1a1a" font-weight="bold">コンテキスト上限 1M（100万トークン）の全体</text>
  <rect x="50" y="40" width="83" height="30" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="91" y="59" text-anchor="middle" font-size="11" fill="#1a1a1a">使う範囲</text>
  <rect x="133" y="40" width="417" height="30" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="341" y="59" text-anchor="middle" font-size="12" fill="#1a1a1a">安全マージン（残りすべて）</text>

  <!-- 拡大の補助線 -->
  <line x1="50" y1="70" x2="50" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="133" y1="70" x2="550" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="58" y="112" font-size="10" fill="#666">「使う範囲」を拡大（目安）</text>

  <!-- 拡大した内訳 -->
  <rect x="50" y="140" width="50" height="45" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="75" y="159" text-anchor="middle" font-size="11" fill="#1a1a1a">tools</text>
  <text x="75" y="176" text-anchor="middle" font-size="10" fill="#1a1a1a">〜1万</text>
  <rect x="100" y="140" width="50" height="45" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="125" y="159" text-anchor="middle" font-size="11" fill="#1a1a1a">system</text>
  <text x="125" y="176" text-anchor="middle" font-size="10" fill="#1a1a1a">〜1万</text>
  <rect x="150" y="140" width="330" height="45" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="315" y="159" text-anchor="middle" font-size="12" fill="#1a1a1a">messages（履歴）</text>
  <text x="315" y="176" text-anchor="middle" font-size="10" fill="#1a1a1a">〜13万：ここを超えたら圧縮</text>
  <rect x="480" y="140" width="70" height="45" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="515" y="159" text-anchor="middle" font-size="11" fill="#1a1a1a">出力</text>
  <text x="515" y="176" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">max_tokens分</text>

  <!-- しきい値 -->
  <line x1="480" y1="132" x2="480" y2="196" stroke="#2b6cb0" stroke-width="2.2"/>
  <text x="480" y="210" text-anchor="middle" font-size="11" fill="#2b6cb0" font-weight="bold">圧縮しきい値 15万</text>

  <!-- 入力の予算 -->
  <path d="M50 222 L50 230 L480 230 L480 222" fill="none" stroke="#333" stroke-width="1"/>
  <text x="265" y="248" text-anchor="middle" font-size="11" fill="#1a1a1a">入力の予算 ＝ tools ＋ system ＋ messages（15万トークン程度）</text>

  <text x="302" y="280" text-anchor="middle" font-size="11" fill="#666">しきい値を上限よりかなり手前に置き、巨大な tool_result の突発的な増加を吸収する</text>
</svg>
