<svg width="605" height="300" viewBox="0 0 605 300" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f7_7_ar77" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 1回の会話 -->
  <rect x="15" y="20" width="250" height="220" rx="6" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="140" y="42" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">1回の会話（エージェント）</text>

  <rect x="35" y="60" width="210" height="48" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="140" y="80" text-anchor="middle" font-size="12" fill="#1a1a1a">system</text>
  <text x="140" y="97" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">+ &lt;long_term_memory&gt;</text>

  <rect x="35" y="130" width="210" height="95" rx="6" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.4"/>
  <text x="140" y="152" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="bold">短期記憶：messages</text>
  <text x="140" y="174" text-anchor="middle" font-size="11" fill="#1a1a1a">いま読んだファイルの中身など</text>
  <text x="140" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">寿命：1回の会話</text>
  <text x="140" y="212" text-anchor="middle" font-size="11" fill="#1a1a1a">（圧縮で薄れる）</text>

  <!-- 長期記憶 -->
  <rect x="395" y="60" width="190" height="165" rx="6" fill="#f5f5f5" stroke="#333" stroke-width="1.4"/>
  <text x="490" y="84" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">長期記憶</text>
  <text x="490" y="102" text-anchor="middle" font-size="12" fill="#1a1a1a" font-family="Consolas,monospace">memory.json</text>
  <line x1="410" y1="112" x2="570" y2="112" stroke="#999" stroke-width="1"/>
  <text x="410" y="130" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">key / content</text>
  <text x="410" y="146" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">tags / updated_at</text>
  <text x="410" y="170" font-size="11" fill="#1a1a1a">ユーザーの好み・決定事項</text>
  <text x="410" y="194" font-size="11" fill="#1a1a1a">寿命：会話をまたいで</text>
  <text x="410" y="212" font-size="11" fill="#1a1a1a">残る</text>

  <!-- 起動時の差し込み -->
  <path d="M393 84 L249 84" stroke="#333" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#f7_7_ar77)"/>
  <text x="320" y="76" text-anchor="middle" font-size="10" fill="#1a1a1a" font-family="Consolas,monospace">memory_prompt()</text>
  <text x="320" y="99" text-anchor="middle" font-size="10" fill="#666">起動時に差し込む</text>

  <!-- 書き留める -->
  <path d="M247 155 L391 155" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#f7_7_ar77)"/>
  <text x="320" y="147" text-anchor="middle" font-size="11" fill="#2b6cb0" font-family="Consolas,monospace">save_memory</text>
  <text x="320" y="170" text-anchor="middle" font-size="10" fill="#1a1a1a">書き留める（承認あり）</text>

  <!-- 取り出す -->
  <path d="M393 205 L249 205" stroke="#2b6cb0" stroke-width="1.5" marker-end="url(#f7_7_ar77)"/>
  <text x="320" y="197" text-anchor="middle" font-size="11" fill="#2b6cb0" font-family="Consolas,monospace">search_memory</text>
  <text x="320" y="220" text-anchor="middle" font-size="10" fill="#1a1a1a">取り出す</text>

  <text x="302" y="268" text-anchor="middle" font-size="11" fill="#666">机の上（短期）に置ききれないものはノート（長期）に書き、</text>
  <text x="302" y="285" text-anchor="middle" font-size="11" fill="#666">必要なときに棚から取り出す</text>
</svg>
