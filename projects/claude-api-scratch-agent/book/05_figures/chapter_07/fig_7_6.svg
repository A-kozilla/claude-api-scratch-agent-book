<svg width="605" height="290" viewBox="0 0 605 290" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <marker id="f7_6_ar76" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- 比較の向き -->
  <text x="345" y="22" text-anchor="middle" font-size="11" fill="#1a1a1a">前方一致：先頭から1文字ずつ比較し、最初に違った位置から後ろは無効</text>
  <path d="M145 34 L545 34" stroke="#333" stroke-width="1.3" marker-end="url(#f7_6_ar76)"/>

  <!-- 列見出し -->
  <text x="185" y="56" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">tools</text>
  <text x="270" y="56" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">system</text>
  <text x="385" y="56" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">messages（履歴）</text>
  <text x="500" y="56" text-anchor="middle" font-size="12" fill="#1a1a1a" font-weight="bold">追加分</text>

  <!-- ① 末尾に追加 -->
  <text x="15" y="94" font-size="12" fill="#1a1a1a">① 末尾に追加</text>
  <rect x="145" y="70" width="80" height="38" rx="4" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="185" y="94" text-anchor="middle" font-size="11" fill="#1a1a1a">読み取り</text>
  <rect x="230" y="70" width="80" height="38" rx="4" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="270" y="94" text-anchor="middle" font-size="11" fill="#1a1a1a">読み取り</text>
  <rect x="315" y="70" width="140" height="38" rx="4" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="385" y="94" text-anchor="middle" font-size="11" fill="#1a1a1a">読み取り</text>
  <rect x="460" y="70" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1"/>
  <text x="500" y="94" text-anchor="middle" font-size="11" fill="#1a1a1a">新規に処理</text>

  <!-- ② system を変更 -->
  <text x="15" y="149" font-size="12" fill="#1a1a1a">② system を変更</text>
  <rect x="145" y="125" width="80" height="38" rx="4" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="185" y="149" text-anchor="middle" font-size="11" fill="#1a1a1a">読み取り</text>
  <rect x="230" y="125" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="2.6"/>
  <text x="270" y="149" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">変更</text>
  <rect x="315" y="125" width="140" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="385" y="149" text-anchor="middle" font-size="11" fill="#1a1a1a">無効（再処理）</text>
  <rect x="460" y="125" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="149" text-anchor="middle" font-size="11" fill="#1a1a1a">無効</text>

  <!-- ③ tools を変更 -->
  <text x="15" y="204" font-size="12" fill="#1a1a1a">③ tools を変更</text>
  <rect x="145" y="180" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="2.6"/>
  <text x="185" y="204" text-anchor="middle" font-size="11" fill="#1a1a1a" font-weight="bold">変更</text>
  <rect x="230" y="180" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="270" y="204" text-anchor="middle" font-size="11" fill="#1a1a1a">無効</text>
  <rect x="315" y="180" width="140" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="385" y="204" text-anchor="middle" font-size="11" fill="#1a1a1a">無効（再処理）</text>
  <rect x="460" y="180" width="80" height="38" rx="4" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="500" y="204" text-anchor="middle" font-size="11" fill="#1a1a1a">無効</text>

  <!-- 凡例 -->
  <rect x="20" y="236" width="16" height="14" rx="2" fill="#e8f0fa" stroke="#2b6cb0" stroke-width="1.2"/>
  <text x="42" y="248" font-size="11" fill="#1a1a1a">キャッシュから読み取り（安い・速い）</text>
  <rect x="300" y="236" width="16" height="14" rx="2" fill="#f5f5f5" stroke="#999" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="322" y="248" font-size="11" fill="#1a1a1a">キャッシュ無効（通常どおり処理）</text>
  <rect x="20" y="261" width="16" height="14" rx="2" fill="#f5f5f5" stroke="#333" stroke-width="2.4"/>
  <text x="42" y="273" font-size="11" fill="#1a1a1a">変更した箇所</text>
  <text x="300" y="273" font-size="11" fill="#2b6cb0" font-weight="bold">変わらないものを前に、変わるものを後ろに</text>
</svg>
