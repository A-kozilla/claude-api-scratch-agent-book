  <text x="40" y="187" font-size="11" fill="#1a1a1a">user：tool_result</text>

  <!-- 圧縮前: 直近 recent -->
  <rect x="30" y="210" width="200" height="26" rx="4" fill="#f5f5f5" stroke="#333" stroke-width="1.2"/>
  <text x="40" y="227" font-size="11" fill="#1a1a1a">assistant：tool_use</text>
